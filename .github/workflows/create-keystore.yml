# Körs EN gång. Skapar signeringsnyckeln som alla framtida bygg ska använda.
# Nyckeln laddas upp som artifact tillsammans med en base64-textfil som du
# klistrar in i repo-secreten ANDROID_KEYSTORE_BASE64.
#
# VIKTIGT: spara .jks-filen någonstans säkert. Tappar du den kan du aldrig mer
# uppdatera över en redan installerad EKIS FIELD — bara avinstallera och börja om.

name: Skapa signeringsnyckel (engångskörning)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Lösenord till nyckeln (minst 6 tecken) – spara det!'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generera nyckel
        run: |
          keytool -genkeypair -v \
            -keystore ekis-release.jks \
            -alias ekis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass  "${{ github.event.inputs.password }}" \
            -dname "CN=EKIS FIELD, OU=Caanel, O=Caanel, L=Sverige, C=SE"
          base64 -w 0 ekis-release.jks > ekis-release.jks.base64.txt

      - name: Ladda upp nyckel
        uses: actions/upload-artifact@v4
        with:
          name: ekis-signing-key
          path: |
            ekis-release.jks
            ekis-release.jks.base64.txt
