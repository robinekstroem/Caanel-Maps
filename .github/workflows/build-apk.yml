name: Build EKIS FIELD APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # secrets går inte att läsa i ett if-villkor. Mappas därför till env på
    # jobbnivå, som däremot fungerar i if.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Make EKIS FIELD fully offline
        run: |
          mkdir -p app/src/main/assets/www/vendor
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o app/src/main/assets/www/vendor/pdf.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o app/src/main/assets/www/vendor/pdf.worker.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js \
            -o app/src/main/assets/www/vendor/jszip.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js \
            -o app/src/main/assets/www/vendor/jspdf.umd.min.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/www/index.html")
          s=p.read_text()
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","vendor/pdf.min.js")
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js","vendor/jszip.min.js")
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.0/jspdf.umd.min.js","vendor/jspdf.umd.min.js")
          p.write_text(s)

          p=Path("app/src/main/assets/www/app.js")
          s=p.read_text()
          s=s.replace('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','vendor/pdf.worker.min.js')
          p.write_text(s)
          PY

      - name: Återskapa signeringsnyckel
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > ekis-release.jks

      # Signerad release: samma nyckel varje gång, så Android installerar över
      # den befintliga appen och behåller ÄTA, att göra-listan och ritningarna.
      - name: Build signed release APK
        if: env.KEYSTORE_B64 != ''
        env:
          EKIS_KEYSTORE_FILE: ${{ github.workspace }}/ekis-release.jks
          EKIS_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PW }}
          EKIS_KEY_ALIAS: ekis
          EKIS_KEY_PASSWORD: ${{ env.KEYSTORE_PW }}
          EKIS_VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk EKIS-Field.apk

      # Utan nyckel byggs debug som förut. Varje sådant bygge får en ny
      # signatur och kan alltså inte installeras över ett tidigare.
      - name: Build debug APK (ingen nyckel konfigurerad)
        if: env.KEYSTORE_B64 == ''
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk EKIS-Field.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EKIS-Field-APK
          path: EKIS-Field.apk
          retention-days: 30
