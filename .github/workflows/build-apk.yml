name: Build EKIS FIELD APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Make EKIS FIELD fully offline
        run: |
          mkdir -p app/src/main/assets/www/vendor
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js \
            -o app/src/main/assets/www/vendor/pdf.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js \
            -o app/src/main/assets/www/vendor/pdf.worker.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js \
            -o app/src/main/assets/www/vendor/jszip.min.js
          curl -L --fail --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js \
            -o app/src/main/assets/www/vendor/jspdf.umd.min.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/www/index.html")
          s=p.read_text()
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js","vendor/pdf.min.js")
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js","vendor/jszip.min.js")
          s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js","vendor/jspdf.umd.min.js")
          p.write_text(s)

          p=Path("app/src/main/assets/www/app.js")
          s=p.read_text()
          s=s.replace('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','vendor/pdf.worker.min.js')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EKIS-Field.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EKIS-Field-APK
          path: EKIS-Field.apk
          retention-days: 30
