plugins {
    id 'com.android.application' version '8.7.3'
}

// Signeringsnyckeln kommer från miljövariabler som CI sätter från ett
// repository secret. Saknas de byggs appen osignerad/debug som förut, så
// lokala bygg fungerar utan nyckel.
def ekisStore   = System.getenv("EKIS_KEYSTORE_FILE")
def ekisStorePw = System.getenv("EKIS_KEYSTORE_PASSWORD")
def ekisAlias   = System.getenv("EKIS_KEY_ALIAS")
def ekisKeyPw   = System.getenv("EKIS_KEY_PASSWORD")

// Räknas ut här, inte inne i defaultConfig. Skrivet som
//   versionCode (System.getenv("X") ?: "77").toInteger()
// tolkar Groovy raden som versionCode(...) FÖLJT av .toInteger() på
// setterns returvärde, som är null -> "Value is null". Samma fälla gäller
// versionName, där ?: i stället hade bundit till setterns returvärde och
// satt namnet till null.
def ekisVersionCode = (System.getenv("EKIS_VERSION_CODE") ?: "77") as Integer
def ekisVersionName = System.getenv("EKIS_VERSION_NAME") ?: "9.3.0-build77"

android {
    namespace 'se.caanel.field'
    compileSdk 35

    defaultConfig {
        applicationId "se.caanel.field"
        minSdk 26
        targetSdk 35
        // Bygg-numret från CI blir versionCode, så varje bygge räknas upp och
        // Android ser nästa APK som en uppdatering i stället för en sidograd.
        versionCode ekisVersionCode
        versionName ekisVersionName
    }

    signingConfigs {
        release {
            if (ekisStore) {
                storeFile file(ekisStore)
                storePassword ekisStorePw
                keyAlias ekisAlias
                keyPassword ekisKeyPw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ekisStore) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.ar:core:1.45.0'
}
