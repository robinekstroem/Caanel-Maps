plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'se.caanel.field'
    compileSdk 35

    defaultConfig {
        applicationId "se.caanel.field"
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName "4.0.24-simple-fade-splash"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
