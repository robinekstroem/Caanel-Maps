plugins {
    id 'com.android.application'
}

android {
    namespace 'se.caanel.field'
    compileSdk 35

    defaultConfig {
        applicationId "se.caanel.field"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "3.1-test"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
